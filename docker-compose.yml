version: '3.8'

services:
  tubevault:
    # Prebuilt via GitHub Actions (.github/workflows/docker.yml) on every push to main.
    # Tags: :latest, :main, :sha-<short>, and semver tags on releases.
    # NOTE: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY used to be passed as compose
    # `build.args` — that no longer applies since there's no local build step here.
    # Vite bakes those into the static frontend bundle at IMAGE BUILD time, so they
    # must be set as GitHub Actions secrets/repo vars in the CI workflow instead.
    # If they're missing there, the shipped image's frontend won't have Supabase auth
    # configured, regardless of what you set in this compose file's environment below.
    image: ghcr.io/the-code-labz/tubevault:${TUBEVAULT_IMAGE_TAG:-latest}
    container_name: tubevault
    # Direct port publish is optional once Traefik is routing to the `traefik` network below.
    # Uncomment only if you also need to reach tubevault directly, bypassing the proxy.
    # ports:
    #   - "4050:4050"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tubevault.entrypoints=websecure"
      - "traefik.http.routers.tubevault.rule=Host(`${TUBEVAULT_HOSTNAME:-tubevault.example.com}`)"
      - "traefik.http.routers.tubevault.tls=true"
      - "traefik.http.routers.tubevault.tls.certresolver=${TRAEFIK_CERTRESOLVER:-cloudflare}"
      - "traefik.http.services.tubevault.loadbalancer.server.port=4050"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.tubevault.service=tubevault"
    environment:
      - NODE_ENV=production
      - PORT=4050
      - STORAGE_BACKEND=${STORAGE_BACKEND:-supabase}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-videos}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET:-videos}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES:-5368709120}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-2}
      - DOWNLOAD_DIR=/app/data/downloads
      - DB_PATH=/app/data/videos.json
      - YTDLP_AUTO_UPDATE=${YTDLP_AUTO_UPDATE:-true}
      - YTDLP_FORMAT=${YTDLP_FORMAT}
      - YTDLP_USER_AGENT=${YTDLP_USER_AGENT}
      - YTDLP_COOKIES_FROM_BROWSER=${YTDLP_COOKIES_FROM_BROWSER}
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE}
      - YTDLP_REFERER=${YTDLP_REFERER}
      - YTDLP_CUSTOM_ARGS=${YTDLP_CUSTOM_ARGS}
    volumes:
      - ./data:/app/data
      # Optional: mount a cookies.txt file if you need authenticated/age-gated downloads
      # - ./cookies.txt:/app/data/cookies.txt:ro
    restart: unless-stopped

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
