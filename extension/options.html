<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; max-width: 420px; }
      h2 { font-size: 16px; }
      label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; }
      input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
      button { margin-top: 16px; padding: 8px 14px; cursor: pointer; }
      #saved { margin-left: 10px; color: #2a7a2a; font-size: 12px; }
      p.hint { font-size: 11px; color: #666; }
    </style>
  </head>
  <body>
    <h2>TubeVault Cookie Sync — Settings</h2>
    <label>
      TubeVault backend URL
      <input id="backendUrl" placeholder="https://tubevault.example.com" />
    </label>
    <label>
      Admin API key (same value as the server's ADMIN_API_KEY)
      <input id="adminKey" type="password" placeholder="paste ADMIN_API_KEY" />
    </label>
    <p class="hint">
      Stored locally in this browser only (chrome.storage.local). Never sent anywhere except
      directly to the backend URL you enter above, over HTTPS.
    </p>
    <button id="save">Save</button><span id="saved"></span>
    <script src="options.js"></script>
  </body>
</html>
